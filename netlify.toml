# BLACKBOXY — Netlify 정적 사이트 설정 (빌드 없음, 폴더 그대로 배포)
[build]
  publish = "."

# 404는 루트의 404.html을 Netlify가 자동으로 사용합니다.

# 대표 도메인이 연결되면 아래 주석을 해제해 netlify.app 주소를 대표 도메인으로 모으세요.
# [[redirects]]
#   from = "https://blackboxy.netlify.app/*"
#   to = "https://blackboxy.app/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

# HTML은 항상 최신본 확인
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS·이미지는 1주일 캐시. HTML에서 style.css?v=날짜 처럼 버전을 붙여 부르므로
# style.css를 고치면 모든 HTML의 ?v= 값을 새 날짜로 바꿔주세요 (그래야 방문자에게 바로 반영됩니다).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# 프롬프트팩 파일: 한글이 깨지지 않게 UTF-8, 내용 수정이 바로 반영되게 매번 확인
[[headers]]
  for = "/downloads/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
